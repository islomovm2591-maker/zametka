<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mening Zametkalarim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: oq daftar — tepada katta yozish maydoni, pastda kunlar bo'yicha zametkalar: sana | vaqt | matn */
:root{
  --bg:#f6f7f9; --paper:#ffffff; --ink:#16191f; --muted:#6b7280; --line:#dfe3ea;
  --accent:#2563eb; --accent-soft:#e8efff; --accent-ink:#ffffff; --danger:#c2410c;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.01em}
.lang{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.lang button{border:0;border-radius:0;background:none;color:var(--muted);padding:6px 12px;font-weight:700;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button{font:inherit;cursor:pointer;border-radius:10px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}

.composer{background:var(--paper);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(22,25,31,.06),0 6px 20px rgba(22,25,31,.06)}
.composer label{font-weight:700;font-size:.95rem}
.composer textarea{width:100%;box-sizing:border-box;min-height:130px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);color:var(--ink);font:inherit;font-size:1.05rem}
.composer textarea:focus{border-color:var(--accent);outline:none}
.composer textarea::placeholder{color:#9aa1ad}
.now{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.big{width:100%;background:var(--accent);color:var(--accent-ink);border:0;padding:14px;font-weight:800;font-size:1.05rem}
.big:active{transform:translateY(1px)}
.flash{color:var(--accent);font-weight:700;font-size:.9rem;min-height:1.3em}

.search{width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit}
.status{color:var(--muted);font-size:.85rem}
.status:empty{display:none}
.day{display:flex;flex-direction:column;gap:8px}
.day h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:800}
.note{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 10px 12px 12px;align-items:start}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:6px 4px;border-radius:10px;background:var(--accent-soft);color:var(--accent);line-height:1.1}
.date .d{font-family:var(--mono);font-weight:700;font-size:1.3rem}
.date .m{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.date .t{font-family:var(--mono);font-size:.75rem;margin-top:3px;color:var(--ink);font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:2px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.edited{font-size:.75rem;color:var(--muted)}
.actions{display:flex;gap:2px}
.icon{border:0;background:none;color:var(--muted);width:38px;height:38px;font-size:1.1rem;display:grid;place-items:center}
.icon:hover{background:var(--bg);color:var(--ink)}
.icon.del:hover{color:var(--danger)}
.confirm{display:flex;flex-direction:column;gap:6px}
.confirm button,.ghost{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;font-size:.88rem}
.confirm .yes{border-color:var(--danger);color:var(--danger);font-weight:700}
.editbox textarea{width:100%;box-sizing:border-box;min-height:90px;resize:vertical;border:2px solid var(--accent);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);font:inherit}
.editbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.editbar .ok{background:var(--accent);color:var(--accent-ink);border:0;padding:7px 16px;font-weight:700;font-size:.9rem}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <h1 data-i18n="title">Zametkalarim</h1>
    <div class="lang" role="group" aria-label="Til / Язык">
      <button type="button" data-lang="uz" aria-pressed="true">UZ</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>

  <form class="composer" id="f">
    <label for="text" data-i18n="label">Bu yerga yozing</label>
    <textarea id="text" data-i18n-ph="placeholder" placeholder="Masalan: Ertaga soat 10:00 da uchrashuv bor"></textarea>
    <div class="now" id="now"></div>
    <button class="big" id="save" type="submit" data-i18n="save">Saqlash</button>
    <div class="flash" id="flash" aria-live="polite"></div>
  </form>

  <input class="search" id="q" type="search" data-i18n-ph="search" placeholder="Qidirish…">
  <div class="status" id="status"></div>
  <div id="out"></div>
</div>

<script>
const I18N={
uz:{title:"Zametkalarim",label:"Bu yerga yozing",placeholder:"Masalan: Ertaga soat 10:00 da uchrashuv bor",save:"Saqlash",search:"Qidirish…",
 willSave:"Saqlanadigan vaqt:",saved:"Saqlandi ✓",typeFirst:"Avval yuqoridagi oq maydonga biror narsa yozing.",loading:"Yuklanmoqda…",
 months:["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"],
 monthsShort:["Yan","Fev","Mar","Apr","May","Iyun","Iyul","Avg","Sen","Okt","Noy","Dek"],
 days:["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"],
 today:"Bugun",yesterday:"Kecha",emptySearch:"Bu so'z bo'yicha zametka topilmadi.",empty:"Hali zametka yo'q. Tepadagi maydonga yozing va «Saqlash» ni bosing.",
 editAria:"Zametkani tahrirlash",cancel:"Bekor qilish",edited:"tahrirlandi:",del:"O'chirish",no:"Yo'q",edit:"Tahrirlash",
 saveErr:"Saqlab bo'lmadi: internetni tekshirib, qayta urinib ko'ring.",updErr:"O'zgarishni saqlab bo'lmadi, qayta urinib ko'ring.",delErr:"O'chirib bo'lmadi, qayta urinib ko'ring.",
 local:"",signin:"",slow:"Ma'lumotlar hali yuklanmadi, internetni tekshiring.",loadErr:"Zametkalarni yuklab bo'lmadi. Sahifani keyinroq oching.",count:n=>`${n} ta zametka`},
ru:{title:"Мои заметки",label:"Пишите здесь",placeholder:"Например: Завтра в 10:00 встреча",save:"Сохранить",search:"Поиск…",
 willSave:"Время сохранения:",saved:"Сохранено ✓",typeFirst:"Сначала напишите что-нибудь в белом поле выше.",loading:"Загрузка…",
 months:["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],
 monthsShort:["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"],
 days:["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"],
 today:"Сегодня",yesterday:"Вчера",emptySearch:"По этому запросу заметок не найдено.",empty:"Заметок пока нет. Напишите в поле вверху и нажмите «Сохранить».",
 editAria:"Редактировать заметку",cancel:"Отмена",edited:"изменено:",del:"Удалить",no:"Нет",edit:"Редактировать",
 saveErr:"Не удалось сохранить: проверьте интернет и попробуйте снова.",updErr:"Не удалось сохранить изменения, попробуйте снова.",delErr:"Не удалось удалить, попробуйте снова.",
 local:"",signin:"",slow:"Данные ещё не загрузились, проверьте интернет.",loadErr:"Не удалось загрузить заметки. Откройте страницу позже.",
 count:n=>{const a=n%10,b=n%100;const w=a===1&&b!==11?"заметка":a>=2&&a<=4&&(b<12||b>14)?"заметки":"заметок";return `${n} ${w}`}}
};
let lang="uz";
try{const s=localStorage.getItem("zametka-lang");lang=I18N[s]?s:(navigator.language||"").toLowerCase().startsWith("ru")?"ru":"uz"}catch(e){}
const T=k=>I18N[lang][k];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
let notes=[], col=null, pending=null, mode="local", editing=null, draft="", focusEdit=false, statusKey=null, flashTimer=null;
const fmt=ts=>{const d=new Date(ts);return `${d.getDate()} ${T("monthsShort")[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function setStatus(k){statusKey=k;showStatus()}
function showStatus(){$("status").textContent=!statusKey?"":statusKey==="count"?(notes.length?T("count")(notes.length):""):T(statusKey)}
function flash(k){$("flash").textContent=T(k);clearTimeout(flashTimer);flashTimer=setTimeout(()=>{$("flash").textContent=""},2500)}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=T(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=T(el.dataset.i18nPh)});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  document.title=T("title"); $("flash").textContent="";
  tick();showStatus();render();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("zametka-lang",lang)}catch(e){}applyLang()}));

function tick(){const d=new Date();$("now").textContent=`${T("willSave")} ${d.getDate()} ${T("months")[d.getMonth()]} ${d.getFullYear()}, ${T("days")[d.getDay()]} · ${pad(d.getHours())}:${pad(d.getMinutes())}`}
setInterval(tick,10000);

function dayLabel(d){
  const now=new Date(), y=new Date(now); y.setDate(now.getDate()-1);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  const base=`${d.getDate()} ${T("months")[d.getMonth()]}${d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():""}, ${T("days")[d.getDay()]}`;
  return same(d,now)?T("today")+" — "+base:same(d,y)?T("yesterday")+" — "+base:base;
}
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!=null)x.textContent=text;return x};

function render(){
  const q=$("q").value.trim().toLowerCase();
  const list=notes.filter(n=>!q||n.text.toLowerCase().includes(q)).sort((a,b)=>b.at-a.at);
  const out=$("out"); out.textContent="";
  if(!list.length){out.append(el("div","empty",q?T("emptySearch"):T("empty")));return}
  const groups=new Map();
  for(const n of list){const d=new Date(n.at),k=d.toDateString(); if(!groups.has(k))groups.set(k,{d,items:[]}); groups.get(k).items.push(n)}
  const wrap=el("div"); wrap.style.cssText="display:flex;flex-direction:column;gap:16px";
  for(const {d,items} of groups.values()){
    const sec=el("section","day"); sec.append(el("h2",null,dayLabel(d)));
    for(const n of items){
      const t=new Date(n.at);
      const row=el("div","note");
      const date=el("div","date"); date.append(el("span","d",t.getDate()),el("span","m",T("monthsShort")[t.getMonth()]),el("span","t",`${pad(t.getHours())}:${pad(t.getMinutes())}`));
      const body=el("div","body");
      if(editing===n.id){
        body.classList.add("editbox");
        const ta=el("textarea"); ta.id="edit-"+n.id; ta.value=draft; ta.setAttribute("aria-label",T("editAria")); ta.oninput=()=>{draft=ta.value};
        const bar=el("div","editbar");
        const ok=el("button","ok",T("save")); const no=el("button","ghost",T("cancel"));
        ok.onclick=()=>{const v=draft.trim(); if(v)update(n.id,v)};
        no.onclick=()=>{editing=null;render()};
        ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();ok.click()} if(e.key==="Escape")no.click()});
        bar.append(ok,no); body.append(ta,bar);
        if(focusEdit){focusEdit=false; setTimeout(()=>{ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)})}
      }else{
        body.append(el("div","txt",n.text));
        if(n.edited)body.append(el("span","edited",T("edited")+" "+fmt(n.edited)));
      }
      row.append(date,body);
      if(editing===n.id){row.style.gridTemplateColumns="auto 1fr"}
      else if(pending===n.id){
        const cf=el("div","confirm");
        const y=el("button","yes",T("del")); y.onclick=()=>remove(n.id);
        const no=el("button",null,T("no")); no.onclick=()=>{pending=null;render()};
        cf.append(y,no); row.append(cf);
      }else{
        const acts=el("div","actions");
        const ed=el("button","icon","✎"); ed.title=T("edit"); ed.setAttribute("aria-label",T("edit"));
        ed.onclick=()=>{editing=n.id;draft=n.text;pending=null;focusEdit=true;render()};
        const del=el("button","icon del","✕"); del.title=T("del"); del.setAttribute("aria-label",T("del"));
        del.onclick=()=>{pending=n.id;editing=null;render()};
        acts.append(ed,del); row.append(acts);
      }
      sec.append(row);
    }
    wrap.append(sec);
  }
  out.append(wrap);
}

function saveLocal(){try{localStorage.setItem("zametkalar",JSON.stringify(notes))}catch(e){}}
function loadLocal(){try{notes=JSON.parse(localStorage.getItem("zametkalar")||"[]")}catch(e){notes=[]}}

async function add(text){
  const n={text,at:Date.now()};
  if(mode==="db"){try{await col.add(n)}catch(e){setStatus("saveErr")}}
  else{n.id=String(n.at);notes.push(n);saveLocal();render()}
}
async function update(id,text){
  editing=null;
  const n=notes.find(x=>x.id===id);
  if(n&&n.text===text){render();return}
  const patch={text,edited:Date.now()};
  if(mode==="db"){render();try{await col.doc(id).update(patch)}catch(e){setStatus("updErr")}}
  else{if(n)Object.assign(n,patch);saveLocal();render()}
}
async function remove(id){
  pending=null;
  if(mode==="db"){try{await col.doc(id).delete()}catch(e){setStatus("delErr")}}
  else{notes=notes.filter(n=>n.id!==id);saveLocal();render()}
}

$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("f").requestSubmit()}});
$("f").addEventListener("submit",e=>{e.preventDefault();const v=$("text").value.trim();
  if(!v){flash("typeFirst");$("text").focus();return}
  tick();add(v);$("text").value="";flash("saved")});
$("q").addEventListener("input",render);

loadLocal(); applyLang();

(async()=>{
  if(!(window.claude&&window.claude.use))return;
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  const id=user&&await user.id();
  if(!db||!id)return;
  col=db.collection("data/users/"+id+"/notes"); mode="db";
  setStatus("loading");
  const timer=setTimeout(()=>{setStatus("slow")},10000);
  col.onSnapshot(snap=>{
    notes=snap.docs.map(d=>({id:d.id,...d.data()})).filter(n=>typeof n.text==="string"&&typeof n.at==="number");
    if(!snap.metadata.fromCache){clearTimeout(timer);setStatus("count")}
    render();
  },err=>{clearTimeout(timer);setStatus("loadErr")});
})();
</script>

</body>
</html>
